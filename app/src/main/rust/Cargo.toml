[package]
name = "my_rust_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.burn]
version = "~0.16"
default-features = false
features = ["wgpu", "train", "metrics"]
